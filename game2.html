<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>천년의 문 — 한국사 시간여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1e6;--dim:#c3b8a4;--gold:#e8bb60;--jade:#5cbcab;--clay:#d8735c;
  --panel:rgba(14,12,10,.82);--line:rgba(232,187,96,.34)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0a08;color:var(--ink);
  font-family:'Gowun Dodum','Apple SD Gothic Neo',system-ui,sans-serif;font-size:16px}
h1,h2,h3,.serif{font-family:'Gowun Batang',serif;margin:0}
#game{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- 배경 ---- */
#bg{position:absolute;inset:0;overflow:hidden;transition:opacity .6s}
#bg .sky{position:absolute;inset:0;transition:background 1.2s}
#bg svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:max(1000px,105%);height:auto;animation:bgin 1.1s cubic-bezier(.2,.8,.25,1) both}
@keyframes bgin{from{opacity:0;transform:translateX(-50%) scale(1.06)}to{opacity:1;transform:translateX(-50%) scale(1)}}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 20%,transparent 40%,rgba(0,0,0,.72) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}

/* ---- 상단 ---- */
#top{position:relative;z-index:5;display:flex;gap:6px;align-items:center;padding:10px 12px}
.era{flex:1;font-size:12px;letter-spacing:.14em;color:var(--gold);
  text-shadow:0 2px 8px rgba(0,0,0,.8)}
.mini{font-size:11.5px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);
  background:rgba(14,12,10,.6);color:var(--dim);cursor:pointer;font-family:inherit;backdrop-filter:blur(4px)}
.mini.on{color:var(--gold);border-color:var(--gold)}

/* ---- 인물 ---- */
#chars{position:relative;z-index:3;flex:1;display:flex;align-items:flex-end;
  justify-content:center;gap:2vw;pointer-events:none;padding-bottom:4px;min-height:0}
#chars .ch{height:min(46vh,340px);animation:chin .5s cubic-bezier(.2,1.2,.35,1) both}
#chars .ch.dim{filter:brightness(.55) saturate(.7)}
@keyframes chin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---- 대사창 ---- */
#box{position:relative;z-index:6;margin:0 10px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;
  backdrop-filter:blur(9px);box-shadow:0 -6px 30px rgba(0,0,0,.5);cursor:pointer}
#who{font-family:'Gowun Batang',serif;font-size:14.5px;color:var(--gold);margin-bottom:4px;
  letter-spacing:.05em;min-height:1.2em}
#txt{font-size:16.4px;line-height:1.72;min-height:4.6em;max-height:34vh;overflow:auto}
#txt.narr{font-family:'Gowun Batang',serif;color:#e7ddc8}
#cur{color:var(--gold);animation:bl .9s steps(1) infinite;font-size:13px}
@keyframes bl{50%{opacity:0}}
#choices{position:relative;z-index:7;margin:0 10px 12px}
.ch-btn{display:block;width:100%;padding:13px 15px;margin-bottom:8px;border-radius:13px;
  border:1px solid var(--line);background:rgba(20,17,13,.86);color:var(--ink);
  font:inherit;font-size:15.4px;text-align:left;cursor:pointer;backdrop-filter:blur(6px);
  animation:cin .36s cubic-bezier(.2,.9,.25,1) both;transition:.16s}
.ch-btn:active{transform:scale(.99)}
.ch-btn:hover{border-color:var(--gold);background:rgba(232,187,96,.14)}
.ch-btn.ok{border-color:var(--jade);background:rgba(92,188,171,.2)}
.ch-btn.no{border-color:var(--clay);background:rgba(216,115,92,.16);animation:sh .4s}
@keyframes cin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(6px)}}

/* ---- 스탯 ---- */
#stats{position:absolute;right:12px;top:46px;z-index:5;display:flex;flex-direction:column;gap:5px}
.st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  background:rgba(14,12,10,.55);padding:4px 9px;border-radius:99px;border:1px solid var(--line);backdrop-filter:blur(4px)}
.st i{display:block;width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.st i>b{display:block;height:100%;width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gain{position:fixed;right:18px;z-index:40;font-weight:700;font-size:15px;
  font-family:'Gowun Batang',serif;animation:gu 1.2s ease-out forwards;text-shadow:0 2px 8px #000}
@keyframes gu{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

/* ---- 오버레이 ---- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;
  background:rgba(6,5,4,.88);backdrop-filter:blur(6px);animation:f .3s both}
@keyframes f{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:480px;background:rgba(20,17,13,.96);border:1px solid var(--line);
  border-radius:18px;padding:20px;max-height:92vh;overflow:auto;
  animation:u .38s cubic-bezier(.2,.9,.25,1) both;text-align:center}
@keyframes u{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:rgba(30,25,19,.9);color:var(--ink);font:inherit;font-size:15.4px;margin-bottom:9px;cursor:pointer}
.btn.pri{background:linear-gradient(180deg,var(--gold),#c39433);color:#1a1307;border-color:var(--gold);font-weight:700}
.tag{font-size:11.5px;letter-spacing:.26em;color:var(--gold);margin-bottom:6px}
.dim{color:var(--dim);font-size:14px}
.small{font-size:12.4px;color:var(--dim)}
.hr{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);
  font-size:14.4px;text-align:left}
.logline{font-size:13.6px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);
  color:var(--dim);text-align:left}
.logline b{color:var(--gold);font-family:'Gowun Batang',serif}
.note{border-left:3px solid var(--jade);padding:8px 0 8px 12px;font-size:13.6px;
  color:var(--dim);margin:12px 0;text-align:left}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(30,25,19,.9);color:var(--ink);font:inherit;font-size:16px;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="game">
  <div id="bg"><div class="sky"></div><div id="art"></div></div>
  <div id="vig"></div><div id="flash"></div>
  <div id="top">
    <span class="era" id="era"></span>
    <button class="mini" id="mSnd">🔇 소리</button>
    <button class="mini" id="mAuto">자동</button>
    <button class="mini" id="mLog">기록</button>
    <button class="mini" id="mSave">저장</button>
    <button class="mini" id="mMenu">메뉴</button>
  </div>
  <div id="stats"></div>
  <div id="chars"></div>
  <div id="choices"></div>
  <div id="box"><div id="who"></div><div id="txt"></div></div>
</div>
<div id="ui"></div>

   · 단일 HTML, 외부 라이브러리 없음
   · [선생님께] STORY 배열만 고치면 대사·선택지·문제를 자유롭게 바꿀 수 있습니다.

  AU.mood=k; AU.idx=0; auApplyMood(k);
}
function auNote(t,f,vol,bell){
  const c=AU.ctx,g=c.createGain(); g.connect(AU.master);
  const dur=bell?2.6:1.0;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(bell?.02:.008));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const o=c.createOscillator(); o.type=bell?"sine":"triangle";
  o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.994,t+dur*.6);
  const o2=c.createOscillator(); o2.type="sine"; o2.frequency.setValueAtTime(f*(bell?3:2),t);
  const g2=c.createGain(); g2.gain.value=bell?.12:.2; o2.connect(g2); g2.connect(g);
  o.connect(g); o.start(t); o2.start(t); o.stop(t+dur+.1); o2.stop(t+dur+.1);
}
function auDrum(t,low){
  const c=AU.ctx,s=c.createBufferSource(); s.buffer=AU.noise;
  const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=low?165:1200; f.Q.value=low?2.2:1.4;
  const g=c.createGain(); g.gain.setValueAtTime(low?.2:.09,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+(low?.34:.15));
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+.5);
}
function auSchedule(){
  if(!AU.ctx)return;
  const m=MOOD[AU.mood]||MOOD.modern, spb=60/m.bpm/2;
  while(AU.next<AU.ctx.currentTime+.3){
    const s=AU.step%16;
    if(s%2===0&&Math.random()<m.dens){
      AU.idx+=[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)];
      if(AU.idx<0)AU.idx+=m.sc.length; if(AU.idx>m.sc.length*2)AU.idx=0;
      const oct=Math.floor(AU.idx/m.sc.length), st=m.sc[AU.idx%m.sc.length];
      auNote(AU.next,m.root*Math.pow(2,st/12+oct),m.bell?.13:.15,m.bell);
    }
    if(m.drum){ if(s%8===0)auDrum(AU.next,true); else if(s%8===3||s%8===6)auDrum(AU.next,false); }
    if(s===0)auNote(AU.next,m.root/2,.08,true);
    AU.next+=spb; AU.step++;
  }
}
function auOn(){
  auInit(); if(!AU.ctx)return;
  if(AU.ctx.state==="suspended")AU.ctx.resume();
  AU.on=true; AU.next=AU.ctx.currentTime+.1;
  AU.master.gain.cancelScheduledValues(AU.ctx.currentTime);
  AU.master.gain.setValueAtTime(AU.master.gain.value,AU.ctx.currentTime);
  AU.master.gain.linearRampToValueAtTime(.3,AU.ctx.currentTime+1.8);
  clearInterval(AU.timer); AU.timer=setInterval(auSchedule,70);
  const b=$("mSnd"); if(b){b.textContent="♪ 소리";b.classList.add("on");}
}
function auOff(){
  if(AU.ctx&&AU.master){
    AU.master.gain.cancelScheduledValues(AU.ctx.currentTime);
    AU.master.gain.setValueAtTime(AU.master.gain.value,AU.ctx.currentTime);
    AU.master.gain.linearRampToValueAtTime(0,AU.ctx.currentTime+.5);
  }
  AU.on=false; clearInterval(AU.timer);
  const b=$("mSnd"); if(b){b.textContent="🔇 소리";b.classList.remove("on");}
}
function auBlip(ok){
  if(!AU.ctx||!AU.on)return;
  const m=MOOD[AU.mood]||MOOD.modern,t=AU.ctx.currentTime;
  (ok?[0,2,4]:[2,1,0]).forEach((n,i)=>auNote(t+i*.08,m.root*Math.pow(2,m.sc[n%m.sc.length]/12+1),.13,false));
}

/* ---------------- 상태 ---------------- */
const KEY="cheonnyeon_v1";
let V={name:"",i:0,st:{지식:0,용기:0,인연:0},quiz:{ok:0,total:0},log:[],bg:"modern",chars:["hero"],era:""};
let auto=false,typing=null,SPEED=26;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(V))}catch(e){}};
const loadV=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};
const idx=id=>STORY.findIndex(n=>n.id===id);

/* ---------------- 렌더 ---------------- */
function setBG(k,era,chars){
  V.bg=k;V.era=era||V.era;V.chars=chars||V.chars;
  auMood(k);
  $("bg").querySelector(".sky").style.background=BG[k].sky;
  $("art").innerHTML=BG[k].art;
  $("era").textContent=V.era;
  drawChars();
}
function drawChars(active){
  $("chars").innerHTML=(V.chars||[]).map(c=>{
    const f=(c===active&&curFace)?curFace:"calm";
    const svg=CHAR[c]?CHAR[c](F[f]||F.calm):"";
    return svg.replace('class="ch"',`class="ch${active&&c!==active?" dim":""}"`);
  }).join("");
}
let curFace="calm";
function stats(){
  $("stats").innerHTML=Object.keys(V.st).map(k=>{
    const col=k==="지식"?"var(--gold)":k==="용기"?"var(--clay)":"var(--jade)";
    return `<div class="st">${k}<i><b style="width:${Math.min(100,V.st[k]*6)}%;background:${col}"></b></i></div>`;
  }).join("");
}
function gain(obj){
  let n=0;
  for(const k in obj){
    V.st[k]=(V.st[k]||0)+obj[k];
    const col=k==="지식"?"var(--gold)":k==="용기"?"var(--clay)":"var(--jade)";
    const d=document.createElement("div");d.className="gain";d.style.color=col;
    d.style.top=(120+n*26)+"px";d.textContent=k+" +"+obj[k];
    document.body.appendChild(d);setTimeout(()=>d.remove(),1300);n++;
  }
  stats();
}
function type(el,text,cb){
  if(reduced||SPEED===0){el.innerHTML=text+'<span id="cur">▾</span>';typing=null;cb&&cb();return;}
  let i=0;el.textContent="";typing={el,text,cb};
  typing.id=setInterval(()=>{
    el.textContent=text.slice(0,++i);
    if(i>=text.length){clearInterval(typing.id);el.innerHTML=text+'<span id="cur">▾</span>';typing=null;cb&&cb();}
  },SPEED);
}
function finish(){if(!typing)return;clearInterval(typing.id);
  typing.el.innerHTML=typing.text+'<span id="cur">▾</span>';const c=typing.cb;typing=null;c&&c();}

/* ---------------- 진행 ---------------- */
let autoTimer=null;
function play(){
  clearTimeout(autoTimer);
  const n=STORY[V.i];
  if(!n)return ending();
  save();
  $("choices").innerHTML="";
  $("box").onclick=null;          // 전환 중 중복 진행 방지
  if(n.t==="bg"){setBG(n.bg,n.era,n.chars);V.i++;return play();}
  if(n.t==="flash"){
    const f=$("flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");
    V.i++;return setTimeout(play,reduced?0:420);
  }
  if(n.t==="end")return ending();
  if(n.t==="n"||n.t==="d")return line(n);
  if(n.t==="c")return choice(n);
  if(n.t==="q")return quiz(n);
  V.i++;play();
}
function jump(n){
  if(n.to){const j=idx(n.to);V.i=(j>=0?j:V.i+1);}else V.i++;
  play();
}
function line(n){
  const isN=(n.t==="n");
  curFace=n.f||"calm";
  drawChars(isN?null:n.w);
  $("who").textContent=isN?"":(NAMES[n.w]||"");
  $("txt").className=isN?"narr":"";
  V.log.push({w:isN?null:n.w,x:n.x});if(V.log.length>200)V.log.shift();
  type($("txt"),n.x,()=>{
    if(auto)autoTimer=setTimeout(()=>jump(n),1500+n.x.length*45);
  });
  $("box").onclick=()=>{if(typing)finish();else jump(n);};
}
function choice(n){
  $("who").textContent="";
  $("txt").className="narr";
  $("txt").textContent=n.q;
  $("box").onclick=null;
  $("choices").innerHTML=n.opts.map((o,i)=>
    `<button class="ch-btn" data-i="${i}">${esc(o.x)}</button>`).join("");
  $("choices").querySelectorAll(".ch-btn").forEach((b,i)=>{
    b.style.animationDelay=(i*70)+"ms";
    b.onclick=()=>{
      const o=n.opts[i];
      V.log.push({w:"hero",x:"▸ "+o.x});
      if(o.st)gain(o.st);
      $("choices").innerHTML="";
      const j=idx(o.to);V.i=(j>=0?j:V.i+1);play();
    };
  });
}
function quiz(n){
  $("who").textContent="";$("txt").className="narr";
  $("txt").textContent="[확인 문제] "+n.q;
  $("box").onclick=null;
  V.quiz.total++;
  let wrong=0;
  $("choices").innerHTML=n.o.map((o,i)=>
    `<button class="ch-btn" data-i="${i}">${esc(o)}</button>`).join("");
  $("choices").querySelectorAll(".ch-btn").forEach((b,i)=>{
    b.style.animationDelay=(i*70)+"ms";
    b.onclick=()=>{
      if(i===n.a){
        b.classList.add("ok");auBlip(true);
        $("choices").querySelectorAll(".ch-btn").forEach(x=>x.disabled=true);
        if(wrong===0){V.quiz.ok++;if(n.st)gain(n.st);}
        setTimeout(()=>{
          $("choices").innerHTML="";
          $("txt").className="narr";
          type($("txt"),n.e,()=>{if(auto)autoTimer=setTimeout(()=>{V.i++;play();},2200);});
          $("box").onclick=()=>{if(typing)finish();else{V.i++;play();}};
        },520);
      }else{
        b.classList.add("no");b.disabled=true;wrong++;auBlip(false);
        if(wrong>=n.o.length-1)
          $("choices").querySelector(`.ch-btn[data-i="${n.a}"]`).classList.add("ok");
      }
    };
  });
}

/* ---------------- 결말 ---------------- */
function ending(){
  const s=V.st, top=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];
  const total=s.지식+s.용기+s.인연;
  const balanced=(Math.max(s.지식,s.용기,s.인연)-Math.min(s.지식,s.용기,s.인연))<=8;
  let title,body;
  if(balanced&&total>=26){
    title="엔딩 · 천년을 잇는 사람";
    body="아는 것과 느끼는 것, 나서는 것이 고루 갖춰졌다. 너는 신라를 외우지 않고 만났다. 한 달 뒤 경주에 갈 때, 너는 안내판보다 먼저 이야기를 떠올릴 것이다.";
  }else if(top==="지식"){
    title="엔딩 · 기록하는 사람";
    body="너는 묻고 또 물었다. 시대마다 남은 것은 결국 기록이었고, 그 기록을 읽는 사람이 있어야 과거는 살아남는다. 너는 그 읽는 사람이 되었다.";
  }else if(top==="용기"){
    title="엔딩 · 앞에 서는 사람";
    body="너는 물러서지 않았다. 빛 속으로 먼저 걸어 들어갔고, 불 옆에서 일손을 보탰다. 화랑 풍월이 너를 보았다면 벗이라 불렀을 것이다.";
  }else{
    title="엔딩 · 이름을 기억하는 사람";
    body="너는 왕과 여왕보다 석공 아사와 보라의 이름을 오래 기억했다. 문화유산 뒤에는 언제나 그것을 만들고 지킨 사람이 있다. 너는 그것을 알아본 사람이다.";
  }
  const qp=V.quiz.total?Math.round(V.quiz.ok/V.quiz.total*100):0;
  $("choices").innerHTML="";$("chars").innerHTML="";$("box").onclick=null;
  $("txt").className="narr";$("who").textContent="";$("txt").textContent="";
  ovl(`<div class="tag">여행 종료</div>
    <h2 class="serif" style="font-size:22px">${title}</h2>
    <p class="dim" style="margin:10px 0 0;font-size:15px;line-height:1.75;text-align:left">${body}</p>
    <div class="hr"></div>
    <div style="text-align:left">
      <div class="kv"><span>여행자</span><b>${esc(V.name||"이름 없음")}</b></div>
      <div class="kv"><span>지식 · 용기 · 인연</span><b>${s.지식} · ${s.용기} · ${s.인연}</b></div>
      <div class="kv" style="border:none"><span>확인 문제</span><b>${V.quiz.ok} / ${V.quiz.total} (${qp}%)</b></div>
    </div>
    <div class="note">오늘 만난 것 — 화랑도와 세속오계, 첨성대와 황룡사 9층 목탑, 삼국 통일의 마지막 상대,
      불국사 다보탑과 석가탑, 무구정광대다라니경, 성덕대왕신종, 그리고 935년의 끝.</div>
    <p class="small">이 화면을 캡처해 선생님께 제출하세요.</p>
    <button class="btn pri" id="again">다른 선택으로 다시</button>
    <button class="btn" id="log2">지나온 이야기 보기</button>`);
  $("again").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}closeOv();title0();};
  $("log2").onclick=()=>{closeOv();logView(true);};
}

/* ---------------- 오버레이 ---------------- */
function ovl(html){$("ui").innerHTML=`<div class="ov"><div class="card">${html}</div></div>`;}
function closeOv(){$("ui").innerHTML="";}
function logView(fromEnd){
  const rows=V.log.slice(-80).map(l=>
    `<div class="logline">${l.w?`<b>${NAMES[l.w]||""}</b> · `:""}${esc(l.x)}</div>`).join("");
  ovl(`<h3 class="serif" style="font-size:19px;margin-bottom:10px">지나온 이야기</h3>
    <div style="max-height:56vh;overflow:auto">${rows||'<p class="dim">아직 기록이 없다.</p>'}</div>
    <button class="btn pri" id="c" style="margin-top:12px">닫기</button>`);
  $("c").onclick=()=>{closeOv();if(fromEnd)ending();};
}
function menu(){
  ovl(`<h3 class="serif" style="font-size:19px;margin-bottom:12px">메뉴</h3>
    <p class="small" style="text-align:left;margin-bottom:6px">글자 속도</p>
    <div style="display:flex;gap:7px;margin-bottom:14px">
      ${[["느리게",44],["보통",26],["빠르게",12],["즉시",0]].map(([n,v])=>
        `<button class="btn" data-s="${v}" style="margin:0;padding:9px;font-size:13px;
          ${SPEED===v?"border-color:var(--gold);color:var(--gold)":""}">${n}</button>`).join("")}
    </div>
    <button class="btn" id="restart">처음부터 다시 시작</button>
    <button class="btn pri" id="close">계속하기</button>`);
  $("ui").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{SPEED=+b.dataset.s;menu();});
  $("close").onclick=closeOv;
  $("restart").onclick=()=>{if(confirm("처음부터 다시 시작할까요? 지금까지의 선택이 지워집니다."))
    {try{localStorage.removeItem(KEY)}catch(e){}closeOv();title0();}};
}

/* ---------------- 시작 ---------------- */
function title0(){
  const prev=loadV();
  setBG("modern","2026년 · 경주",["hero"]);
  V.st={지식:0,용기:0,인연:0};stats();
  $("chars").innerHTML="";$("choices").innerHTML="";
  $("who").textContent="";$("txt").textContent="";
  ovl(`<div class="tag">한국사 시간여행</div>
    <h1 class="serif" style="font-size:30px;line-height:1.28">천년의 문</h1>
    <p class="dim" style="margin:10px 0 0">수학여행에서 만난 첨성대의 돌 한 단.<br>
      손을 대는 순간, 신라 천년이 열린다.</p>
    <p class="small" style="margin:10px 0 0">6세기 화랑 → 7세기 선덕여왕 → 8세기 불국사 → 935년의 끝</p>
    <div class="hr"></div>
    <input type="text" id="nm" maxlength="14" placeholder="이름 (예: 3-2 김OO)">
    <button class="btn pri" id="go">♪ 소리 켜고 문을 연다</button>
    <button class="btn" id="goMute">소리 끄고 문을 연다</button>
    ${prev&&prev.name?`<button class="btn" id="cont">이어서 · ${esc(prev.name)}</button>`:""}
    <p class="small" style="margin:6px 0 0">선택에 따라 결말이 달라집니다. 정답은 없습니다.<br>시대가 바뀌면 배경음악도 함께 바뀝니다.</p>`);
  const start=(snd)=>{
    const v=$("nm").value.trim()||"여행자";
    V={name:v,i:0,st:{지식:0,용기:0,인연:0},quiz:{ok:0,total:0},log:[],bg:"modern",chars:["hero"],era:""};
    closeOv();stats();
    if(snd)auOn(); else auOff();
    play();
  };
  $("go").onclick=()=>start(true);
  $("goMute").onclick=()=>start(false);
  $("nm").addEventListener("keydown",e=>{if(e.key==="Enter")start(true);});
  const c=$("cont");
  if(c)c.onclick=()=>{V=prev;closeOv();stats();auOn();setBG(V.bg,V.era,V.chars);play();};
}

$("mSnd").onclick=()=>AU.on?auOff():auOn();
$("mAuto").onclick=()=>{auto=!auto;$("mAuto").classList.toggle("on",auto);
  if(!auto)clearTimeout(autoTimer);else play();};
$("mLog").onclick=()=>logView();
$("mMenu").onclick=menu;
$("mSave").onclick=()=>{save();$("mSave").textContent="저장됨";
  setTimeout(()=>$("mSave").textContent="저장",1400);};
title0();
</script>
