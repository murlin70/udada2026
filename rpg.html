<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>신라 1000년 RPG — 오픈소스 스타터</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<!-- Phaser 3 (MIT 라이선스, 오픈소스) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<style>
:root{--gold:#e5b455;--ink:#f2ece0;--panel:rgba(16,14,11,.9);--line:rgba(229,180,85,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0e0c09;color:var(--ink);
  font-family:'Gowun Dodum','Apple SD Gothic Neo',system-ui,sans-serif;touch-action:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
canvas{border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
#hud{position:fixed;left:10px;top:10px;z-index:10;display:flex;gap:6px;flex-wrap:wrap}
.tagb{font-size:11.5px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--gold);backdrop-filter:blur(4px)}
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:12;margin:10px;padding:14px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;display:none;
  backdrop-filter:blur(8px);max-width:640px;margin-inline:auto;cursor:pointer}
#dlg.on{display:block}
#dname{font-family:'Gowun Batang',serif;color:var(--gold);font-size:14px;margin-bottom:4px}
#dtext{font-size:15.6px;line-height:1.7;min-height:3.4em}
#pad{position:fixed;right:14px;bottom:110px;z-index:11;display:none;
  grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:5px}
#pad.on{display:grid}
#pad button{border-radius:12px;border:1px solid var(--line);background:rgba(16,14,11,.6);
  color:var(--gold);font-size:19px;font-family:inherit}
#pad button:active{background:rgba(229,180,85,.3)}
#act{position:fixed;left:14px;bottom:110px;z-index:11;width:74px;height:74px;border-radius:50%;
  border:2px solid var(--line);background:rgba(16,14,11,.6);color:var(--gold);font-size:14px;
  font-family:inherit;display:none}
#act.on{display:block}
</style>
</head>
<body>
<div id="wrap"><div id="game"></div></div>
<div id="hud">
  <span class="tagb" id="tQuest">퀘스트 · 0 / 3</span>
  <span class="tagb" id="tRelic">유물 · 0 / 3</span>
</div>
<div id="pad">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
  <span></span><button data-d="down">▼</button><span></span>
</div>
<button id="act">말걸기</button>
<div id="dlg"><div id="dname"></div><div id="dtext"></div></div>

<script>
/* ===========================================================================
   신라 1000년 RPG — 오픈소스 스타터 코드
   ---------------------------------------------------------------------------
   · 엔진: Phaser 3 (MIT 라이선스). CDN 한 줄만 불러오면 끝, 설치 필요 없음.
   · 그래픽: 외부 이미지 없이 코드로 직접 그립니다(도트 텍스처 생성).
     → 저작권 문제 없이 수업에서 바로 쓰고, 학생이 색과 모양을 고칠 수 있습니다.
   · 학생이 고칠 곳에는 모두 [고치기] 표시를 달아 두었습니다.

   ■ 수업에서 확장하는 방법
     1) MAP 문자열을 고쳐 지도를 새로 그린다 (.=길 #=담장 ~=물 T=나무 B=건물)
     2) NPCS 배열에 인물을 추가한다 (이름·위치·대사·퀘스트)
     3) RELICS 배열에 유물을 추가한다
     4) QUIZ 배열에 확인 문제를 추가한다
=========================================================================== */

/* ---------- [고치기 1] 지도 --------------------------------------------
   한 칸 = 32px. 원하는 대로 글자를 바꿔 지도를 새로 만들 수 있습니다.
   . 길   # 담장(못 지나감)   ~ 물(못 지나감)   T 나무(못 지나감)   B 건물(못 지나감)
--------------------------------------------------------------------- */
const MAP = [
"########################",
"#....T......#.....T....#",
"#..BB.......#...BB.....#",
"#..BB...........BB.....#",
"#.......@..............#",
"#....#####......T......#",
"#....#...#.....#########",
"#....#...#.....#.......#",
"#T...##.##.....#..BBB..#",
"#..............#..BBB..#",
"#....~~~~~.....#.......#",
"#....~~~~~.........T...#",
"#....~~~~~....#####....#",
"#.............#...#....#",
"#...T.........#...#..T.#",
"#.............#####....#",
"########################"];

/* ---------- [고치기 2] 인물 ---------------------------------------------
   x,y = 칸 좌표(0부터). lines = 말 순서. quest = 퀘스트 이름(없으면 생략)
--------------------------------------------------------------------- */
const NPCS = [
 {id:"bojong", name:"낭도 보종", x:10, y:4, color:0x5bb8a4,
  lines:["서라벌에 온 것을 환영한다, 새 낭도여.",
         "이 왕경에는 흩어진 유물 셋이 있다. 모두 찾아 나에게 가져오너라.",
         "월성 담장 안, 못가, 그리고 절터를 살펴보아라."],
  quest:"유물 세 점 찾기"},
 {id:"damsi", name:"일관 담시", x:17, y:8, color:0xe5b455,
  lines:["첨성대는 선덕여왕 때 세운 돌 천문대다.",
         "스물일곱 단으로 쌓았지. 하늘을 읽는 일은 나라의 일이었다."],
  quiz:0, quest:"첨성대 문답"},
 {id:"aro", name:"시녀 아로", x:6, y:13, color:0xd1685a,
  lines:["월지는 문무왕 때 만든 연못이에요.",
         "밤이면 물에 비친 별궁이 정말 아름답답니다."],
  quiz:1, quest:"월지 문답"}
];

/* ---------- [고치기 3] 유물 --------------------------------------------- */
const RELICS = [
 {id:"gwan", name:"천마총 금관", x:7, y:7, color:0xf0c96a,
  desc:"나뭇가지·사슴뿔 모양 장식이 달린 신라 금관."},
 {id:"tile", name:"얼굴무늬 수막새", x:4, y:11, color:0xe3c58f,
  desc:"‘신라의 미소’라 불리는 기와. 은은한 웃음이 남아 있다."},
 {id:"sutra",name:"무구정광대다라니경", x:21, y:9, color:0xe8d9b5,
  desc:"불국사 석가탑에서 나온, 현존 가장 오래된 목판 인쇄물."}
];

/* ---------- [고치기 4] 확인 문제 ---------------------------------------- */
const QUIZ = [
 {q:"첨성대를 세운 것으로 전하는 왕은?", o:["선덕여왕","진흥왕","문무왕","경덕왕"], a:0,
  e:"첨성대는 선덕여왕 때 세운 것으로 전합니다."},
 {q:"동궁과 월지를 만든 왕은?", o:["문무왕","법흥왕","지증왕","진평왕"], a:0,
  e:"월지(안압지)는 문무왕 때 만든 인공 연못입니다."}
];

/* =========================== 아래는 엔진 부분 =========================== */
const TILE=32, COLS=MAP[0].length, ROWS=MAP.length;
const solidChars="#~TB";
const isSolid=(cx,cy)=> cx<0||cy<0||cx>=COLS||cy>=ROWS||solidChars.includes(MAP[cy][cx]);
const mq=q=>!!(window.matchMedia&&window.matchMedia(q).matches);
const isTouch=mq("(pointer:coarse)")||("ontouchstart" in window);
if(isTouch){document.getElementById("pad").classList.add("on");
            document.getElementById("act").classList.add("on");}

const state={relics:[],quests:[],talking:null,line:0,quizOpen:false};
const dlg=document.getElementById("dlg"), dname=document.getElementById("dname"),
      dtext=document.getElementById("dtext");

class Main extends Phaser.Scene{
  preload(){
    // 코드로 텍스처를 그린다 (외부 이미지 없음)
    const g=this.make.graphics({add:false});
    const T=(key,fn)=>{g.clear();fn(g);g.generateTexture(key,TILE,TILE);};
    T("road",  g=>{g.fillStyle(0x6b7a52).fillRect(0,0,TILE,TILE);
                   g.fillStyle(0x76865b).fillRect(2,2,TILE-4,TILE-4);});
    T("wall",  g=>{g.fillStyle(0x4a4034).fillRect(0,0,TILE,TILE);
                   g.fillStyle(0x5c5142).fillRect(2,2,TILE-4,12);
                   g.fillStyle(0x5c5142).fillRect(2,18,TILE-4,12);});
    T("water", g=>{g.fillStyle(0x2f5a6b).fillRect(0,0,TILE,TILE);
                   g.lineStyle(2,0x4d8296).beginPath();
                   g.moveTo(3,12);g.lineTo(12,8);g.lineTo(21,12);g.lineTo(29,8);g.strokePath();
                   g.beginPath();g.moveTo(3,22);g.lineTo(12,18);g.lineTo(21,22);g.lineTo(29,18);g.strokePath();});
    T("tree",  g=>{g.fillStyle(0x6b7a52).fillRect(0,0,TILE,TILE);
                   g.fillStyle(0x3c2f22).fillRect(14,20,5,10);
                   g.fillStyle(0x2f5e3c).fillCircle(16,15,11);
                   g.fillStyle(0x3d7a4d).fillCircle(13,12,7);});
    T("build", g=>{g.fillStyle(0x6b7a52).fillRect(0,0,TILE,TILE);
                   g.fillStyle(0x7a4b3a).fillRect(2,12,TILE-4,18);
                   g.fillStyle(0x99604a).fillRect(2,8,TILE-4,6);
                   g.fillStyle(0x2b1c16).fillRect(12,20,8,10);});
    // 주인공 (화랑)
    T("hero",  g=>{g.fillStyle(0x3d6b8f).fillRect(9,14,14,14);
                   g.fillStyle(0xf0d9bf).fillCircle(16,10,7);
                   g.fillStyle(0x2b3a48).fillRect(9,3,14,5);
                   g.fillStyle(0xe5b455).fillRect(9,7,14,2);
                   g.fillStyle(0xe5b455).fillRect(14,0,4,4);
                   g.fillStyle(0x1b2430).fillRect(12,9,2,2).fillRect(18,9,2,2);});
    T("npc",   g=>{g.fillStyle(0xffffff).fillRect(9,14,14,14);
                   g.fillStyle(0xf0d9bf).fillCircle(16,10,7);
                   g.fillStyle(0x3b3128).fillRect(9,3,14,5);});
    T("relic", g=>{g.fillStyle(0xffffff).fillCircle(16,16,9);
                   g.fillStyle(0x000000,0.25).fillCircle(16,16,4);});
    g.destroy();
  }

  create(){
    const W=COLS*TILE, H=ROWS*TILE;
    this.physics.world.setBounds(0,0,W,H);

    // 지도 그리기
    this.walls=this.physics.add.staticGroup();
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const c=MAP[y][x], px=x*TILE+TILE/2, py=y*TILE+TILE/2;
      this.add.image(px,py,"road");
      if(c==="#") this.walls.create(px,py,"wall");
      else if(c==="~") this.walls.create(px,py,"water");
      else if(c==="T") this.walls.create(px,py,"tree");
      else if(c==="B") this.walls.create(px,py,"build");
    }

    // 주인공
    let sx=2,sy=2;
    MAP.forEach((row,y)=>{const i=row.indexOf("@");if(i>=0){sx=i;sy=y;}});
    this.hero=this.physics.add.sprite(sx*TILE+16,sy*TILE+16,"hero");
    this.hero.setCollideWorldBounds(true).setSize(20,20).setOffset(6,10);
    this.physics.add.collider(this.hero,this.walls);

    // 인물
    this.npcs=this.physics.add.staticGroup();
    NPCS.forEach(n=>{
      const s=this.npcs.create(n.x*TILE+16,n.y*TILE+16,"npc");
      s.setTint(n.color); s.data0=n;
      this.add.text(n.x*TILE+16,n.y*TILE-8,n.name,
        {fontFamily:"Gowun Dodum, sans-serif",fontSize:"11px",color:"#f2ece0"})
        .setOrigin(.5).setShadow(0,1,"#000",3);
    });
    this.physics.add.collider(this.hero,this.npcs);

    // 유물
    this.relics=this.physics.add.group();
    RELICS.forEach(r=>{
      const s=this.relics.create(r.x*TILE+16,r.y*TILE+16,"relic");
      s.setTint(r.color); s.data0=r; s.body.setAllowGravity(false);
      this.tweens.add({targets:s,y:s.y-6,duration:900,yoyo:true,repeat:-1,ease:"Sine.inOut"});
    });
    this.physics.add.overlap(this.hero,this.relics,(h,s)=>this.pick(s));

    // 카메라
    this.cameras.main.setBounds(0,0,W,H).startFollow(this.hero,true,.12,.12);
    this.cameras.main.setZoom(Math.min(2,Math.max(1,Math.floor(innerWidth/420))));

    // 입력
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keyE=this.input.keyboard.addKey("SPACE");
    this.touchDir={up:0,down:0,left:0,right:0};
    document.querySelectorAll("#pad button").forEach(b=>{
      const d=b.dataset.d, on=e=>{e.preventDefault();this.touchDir[d]=1},
            off=e=>{e.preventDefault();this.touchDir[d]=0};
      b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off);
      b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
    });
    document.getElementById("act").onclick=()=>this.interact();
    dlg.onclick=()=>this.nextLine();
    this.input.keyboard.on("keydown-SPACE",()=>{
      if(state.talking)this.nextLine(); else this.interact();
    });
    hud();
  }

  update(){
    if(state.talking||state.quizOpen){this.hero.setVelocity(0);return;}
    const sp=150, c=this.cursors, t=this.touchDir;
    let vx=0,vy=0;
    if(c.left.isDown||t.left)vx=-sp;
    if(c.right.isDown||t.right)vx=sp;
    if(c.up.isDown||t.up)vy=-sp;
    if(c.down.isDown||t.down)vy=sp;
    this.hero.setVelocity(vx,vy);
    if(vx||vy)this.hero.setFlipX(vx<0);
  }

  interact(){
    // 가까운 인물 찾기
    let best=null,bd=9999;
    this.npcs.getChildren().forEach(s=>{
      const d=Phaser.Math.Distance.Between(this.hero.x,this.hero.y,s.x,s.y);
      if(d<bd){bd=d;best=s;}
    });
    if(best&&bd<52)this.talk(best.data0);
  }
  talk(n){
    state.talking=n;state.line=0;
    dlg.classList.add("on");dname.textContent=n.name;dtext.textContent=n.lines[0];
  }
  nextLine(){
    const n=state.talking;if(!n)return;
    state.line++;
    if(state.line<n.lines.length){dtext.textContent=n.lines[state.line];return;}
    dlg.classList.remove("on");state.talking=null;
    if(n.quiz!==undefined)this.askQuiz(n);
    else if(n.quest&&!state.quests.includes(n.quest)){state.quests.push(n.quest);hud();}
  }
  askQuiz(n){
    state.quizOpen=true;
    const q=QUIZ[n.quiz];
    dlg.classList.add("on");dname.textContent=n.name+" · 확인 문제";
    dtext.innerHTML=`<div style="margin-bottom:8px">${q.q}</div>`+
      q.o.map((o,i)=>`<button data-i="${i}" style="display:block;width:100%;margin:5px 0;padding:10px;
        border-radius:10px;border:1px solid var(--line);background:rgba(30,25,19,.9);
        color:var(--ink);font:inherit;font-size:14.6px;text-align:left">${o}</button>`).join("");
    dlg.onclick=null;
    dtext.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const ok=(+b.dataset.i===q.a);
      b.style.borderColor=ok?"#63c08a":"#d1685a";
      if(ok){
        dtext.innerHTML=`<div>${q.e}</div>`;
        if(n.quest&&!state.quests.includes(n.quest)){state.quests.push(n.quest);hud();}
        setTimeout(()=>{dlg.classList.remove("on");state.quizOpen=false;dlg.onclick=()=>this.nextLine();},1800);
      }
    });
  }
  pick(s){
    const r=s.data0;
    if(state.relics.includes(r.id))return;
    state.relics.push(r.id);hud();
    s.destroy();
    dlg.classList.add("on");dname.textContent="유물 확보";
    dtext.textContent=r.name+" — "+r.desc;
    setTimeout(()=>{if(!state.talking)dlg.classList.remove("on");},2400);
    if(state.relics.length===RELICS.length){
      setTimeout(()=>{
        dlg.classList.add("on");dname.textContent="탐사 완료";
        dtext.textContent="유물 세 점을 모두 찾았다! 낭도 보종에게 돌아가 보고하자.";
      },2600);
    }
  }
}
function hud(){
  document.getElementById("tQuest").textContent="퀘스트 · "+state.quests.length+" / "+(NPCS.filter(n=>n.quest).length);
  document.getElementById("tRelic").textContent="유물 · "+state.relics.length+" / "+RELICS.length;
}

new Phaser.Game({
  type:Phaser.AUTO, parent:"game",
  width:Math.min(720,innerWidth-16), height:Math.min(480,innerHeight-120),
  backgroundColor:"#0e0c09", pixelArt:true,
  physics:{default:"arcade",arcade:{gravity:{y:0},debug:false}},
  scene:[Main],
  scale:{mode:Phaser.Scale.NONE}
});
</script>
</body>
</html>
